name: refresh-github-pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-refresh.yml'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request-pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
          cat response.json
          test "$code" = "201"
