name: renko-total-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core golden tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build deterministic sample
        run: PYTHONPATH=src python scripts/build_sample.py
      - name: Validate sample JSON
        run: python -c "import json; d=json.load(open('web/data/sample.json')); assert d['bricks']; assert 'metrics' in d"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate web JavaScript syntax
        run: node --check web/app.js
