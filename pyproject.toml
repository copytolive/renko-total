[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "copytolive-renko-total"
version = "1.0.0"
description = "Canonical integer Renko + raw BID/ASK tick replay research stack"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.optional-dependencies]
data = ["duckdb>=1.3", "pyarrow>=20", "pandas>=2.2", "polars>=1.30", "numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
